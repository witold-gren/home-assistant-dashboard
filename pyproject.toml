[project]
name = "home-assistant-dashboard"
version = "0.1.6"
description = "Home Dashboard for Home Assistant: a touch-first dashboard strategy for phones and wall tablets."
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/browser/*" = ["E501"]  # JavaScript embedded in strings
"dev/check_frontend.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
