name: Documentation site

# Builds the documentation (docs/, README, CHANGELOG) with MkDocs Material and publishes it on GitHub Pages:
# https://witold-gren.github.io/home-assistant-dashboard/
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "README.pl.md"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "dev/docs_site.py"
      - "requirements_docs.txt"
      - "custom_components/home_dashboard/brand/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "README.pl.md"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "dev/docs_site.py"
      - "requirements_docs.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
