<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Music</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: Roboto, Arial, sans-serif;
        color: #1b1b1f;
        background: #f6f6f8;
      }
      h1 {
        margin: 8px 0 16px;
        font-size: 26px;
      }
      h2 {
        margin: 24px 0 12px;
        font-size: 18px;
      }
      .now {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border-radius: 14px;
        background: #d8e6f3;
      }
      .cover {
        border-radius: 12px;
        aspect-ratio: 1;
      }
      .now .cover {
        width: 56px;
      }
      .albums {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      small {
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <div class="now">
      <div class="cover" style="background: linear-gradient(135deg, #f7b267, #f25c54)"></div>
      <div><strong id="track"></strong><br /><small id="place"></small></div>
    </div>
    <h2 id="albums-title"></h2>
    <div class="albums" id="albums"></div>
    <script type="module">
      // Stands in for a music app in a frame: Music Assistant itself would show a real library.
      const pl = new URLSearchParams(window.location.search).get("language") === "pl";
      const say = (english, polish) => (pl ? polish : english);
      document.getElementById("title").textContent = say("Discover", "Odkrywaj");
      document.getElementById("track").textContent = say("Morning playlist", "Poranna lista");
      document.getElementById("place").textContent = say("Living room", "Salon");
      document.getElementById("albums-title").textContent = say("Recently played", "Ostatnio odtwarzane");
      const colours = ["#4d7ea8, #1d3b53", "#8fbf7f, #2d5a3d", "#e0a458, #7a3e1d", "#b08bd6, #4a2f6b", "#e07a8b, #8a2f45", "#6b6f7a, #2b2d33"];
      const names = [say("Quiet evening", "Spokojny wieczór"), say("Road trip", "W drodze"), say("Focus", "Skupienie"), say("Dinner", "Kolacja"), say("Weekend", "Weekend"), say("Radio", "Radio")];
      document.getElementById("albums").innerHTML = names
        .map((name, index) => `<div><div class="cover" style="background: linear-gradient(135deg, ${colours[index]})"></div><strong>${name}</strong></div>`)
        .join("");
    </script>
  </body>
</html>
